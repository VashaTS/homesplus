/*
 * Unofficial Fabric 26.2 port of "/sethome and /home Commands" by CornDawgCoco.
 * Original is MIT-licensed (Modrinth project NbN1WVzr, version 1.0.0 for Minecraft 26.1.2).
 * Minecraft 26.x is not obfuscated, so this uses the non-remapping Loom plugin and no mappings.
 */
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	runs {
		configureEach {
			ideConfigGenerated = true
		}
		client {
			runDir = 'run'
		}
		server {
			runDir = 'run/server'
		}
		gametest {
			server()
			name = 'Game Test'
			runDir = 'build/gametest'
			vmArg '-Dfabric-api.gametest'
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/report.xml"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'sethome-test'
		eula = true
		enableGameTests = true
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_sethome" }
	}
}
